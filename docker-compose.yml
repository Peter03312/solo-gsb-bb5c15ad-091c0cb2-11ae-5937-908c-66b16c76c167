services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cnc
      POSTGRES_PASSWORD: cnc_password
      POSTGRES_DB: cnc_audit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnc -d cnc_audit"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://cnc:cnc_password@db:5432/cnc_audit
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
